<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Beside">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="Beside">
<title>Beside</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<!-- LOGIN -->
<section id="login" class="login" hidden>
  <div class="login-card" id="loginCode">
    <img class="app-icon" src="/icon.svg" alt="" width="88" height="88">
    <h1>Beside</h1>
    <p class="soft">Looking after Kimon's heart, together.</p>
    <form id="loginForm" autocomplete="off">
      <label for="code" class="sr">Passcode</label>
      <input id="code" type="password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Passcode" required>
      <button class="btn primary" type="submit">Come in</button>
      <p id="loginMsg" class="msg" role="status" aria-live="polite"></p>
    </form>
  </div>
  <div class="login-card who" id="loginWho" hidden>
    <div id="whoPick">
      <h1>Who's using this phone?</h1>
      <p class="soft">So Beside opens on the right screen. You can change it in Settings.</p>
      <div class="who-list">
        <button class="who-opt" type="button" data-who="kimon"><span class="who-ic k">K</span><span class="who-t"><b>I'm Kimon</b><small>My day, my tablets, telling the family</small></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
        <button class="who-opt" type="button" data-who="family"><span class="who-ic f"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.3-7-9.4C5 7.9 7 6 9.3 6c1.1 0 2.1.5 2.7 1.3C12.6 6.5 13.6 6 14.7 6 17 6 19 7.9 19 10.6 19 15.7 12 20 12 20z"/></svg></span><span class="who-t"><b>I'm family</b><small>His record, check-ins and Leffy</small></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
    </div>
    <form id="whoName" hidden>
      <h1>What should we call you?</h1>
      <p class="soft">Your name shows next to what you add, so everyone knows who did what.</p>
      <label for="nameInput" class="sr">Your first name</label>
      <input id="nameInput" maxlength="40" autocomplete="given-name" placeholder="First name">
      <button class="btn primary" type="submit">Continue</button>
    </form>
  </div>
</section>

<!-- APP -->
<main id="app" hidden>
  <header class="top">
    <span class="brand"><img src="/icon.svg" alt="" width="28" height="28">Beside</span>
    <span class="top-right">
      <a id="homeBtn" class="home-btn" href="/me" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg><span>My home</span></a>
      <button id="sync" class="sync" type="button" aria-live="polite"><i></i><span>Connecting</span></button>
      <button id="shareBtn" class="icon-btn" type="button" aria-label="Share a summary for his doctor"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button>
      <button id="gearBtn" class="icon-btn" type="button" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </span>
  </header>

  <div class="stage">
    <!-- ASK LEFFY -->
    <section class="view chat-view" id="view-ask" data-view="ask" hidden>
      <div class="chat" id="chat"></div>
    </section>

    <!-- CHECK-IN -->
    <section class="view" id="view-check" data-view="check" hidden>
      <div class="deck" id="checkDeck"></div>
    </section>

    <!-- DAD: monitor, nudge, care plan -->
    <section class="view" id="view-dad" data-view="dad" hidden>
      <div class="rec" id="dad"></div>
    </section>

    <!-- RECORD -->
    <section class="view" id="view-record" data-view="record">
      <div class="rec" id="rec"></div>
    </section>
  </div>

  <nav class="nav" aria-label="Sections">
    <button class="nav-btn" data-go="record" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg><span>His record</span></button>
    <button class="nav-btn" data-go="check">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1z"/></svg><span>Ask Dad</span></button>
    <button class="nav-btn" data-go="dad">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.3-7-9.4C5 7.9 7 6 9.3 6c1.1 0 2.1.5 2.7 1.3C12.6 6.5 13.6 6 14.7 6 17 6 19 7.9 19 10.6 19 15.7 12 20 12 20z"/></svg><span>Monitor</span></button>
    <button class="nav-btn" data-go="ask">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3l1.6 4.4L16 9l-4.4 1.6L10 15l-1.6-4.4L4 9l4.4-1.6zM18 13l.9 2.1L21 16l-2.1.9L18 19l-.9-2.1L15 16l2.1-.9zM18 2.5l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6z"/></svg><span>Ask Leffy</span></button>
  </nav>
</main>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="/app.js"></script>
</body>
</html>
