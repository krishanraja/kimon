<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kimon">
<title>Beside Kimon</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<!-- LOGIN -->
<section id="login" class="login" hidden>
  <div class="login-card">
    <svg class="heart" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 41s-15-9.2-15-20.2C9 14.5 13.6 10 19 10c2.2 0 4 .9 5 2.4C25 10.9 26.8 10 29 10c5.4 0 10 4.5 10 10.8C39 31.8 24 41 24 41z"/><path class="pulse" d="M11 25h8l3-5 4 9 3-4h8"/></svg>
    <h1>Beside Kimon</h1>
    <p class="soft">Family only. Enter the access code.</p>
    <form id="loginForm" autocomplete="off">
      <label for="code" class="sr">Access code</label>
      <input id="code" type="password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Access code" required>
      <button class="btn primary" type="submit">Come in</button>
      <p id="loginMsg" class="msg" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>

<!-- APP -->
<main id="app" hidden>
  <header class="top">
    <span class="brand">Beside Kimon</span>
    <span class="top-right">
      <button id="sync" class="sync" type="button" aria-live="polite"><i></i><span>Connecting</span></button>
      <button id="shareBtn" class="icon-btn" type="button" aria-label="Share a summary for his doctor"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button>
      <button id="gearBtn" class="icon-btn" type="button" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </span>
  </header>

  <div class="stage">
    <!-- ASK -->
    <section class="view" id="view-ask" data-view="ask">
      <!-- idle / listening -->
      <div class="ask-idle" id="askIdle">
        <p class="eyebrow" id="askEyebrow">Tap and talk</p>
        <h2 class="ask-q" id="askQ">What's on your mind about Dad?</h2>
        <button id="orb" class="orb" type="button" aria-label="Start speaking" aria-pressed="false">
          <span class="ring r1"></span><span class="ring r2"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg>
        </button>
        <p class="live" id="live" aria-live="polite"></p>
        <div class="ask-under">
          <button class="link" id="typeInstead" type="button">Type instead</button>
          <span class="dot-sep" aria-hidden="true"></span>
          <button class="link" id="ideas" type="button">Ideas</button>
        </div>
      </div>

      <!-- review what was said -->
      <div class="ask-review" id="askReview" hidden>
        <p class="eyebrow">Your concern</p>
        <label for="concern" class="sr">Your concern</label>
        <textarea id="concern" maxlength="2000" placeholder="Type or speak the worry, the way you'd tell a doctor friend."></textarea>
        <div id="flag" class="flag" hidden></div>
        <div class="row">
          <button class="btn ghost" id="redo" type="button">Start over</button>
          <button class="btn primary grow" id="askBtn" type="button">Get the answer</button>
        </div>
      </div>

      <!-- thinking -->
      <div class="ask-thinking" id="askThinking" hidden>
        <div class="beat" aria-hidden="true">
          <span class="beat-glow"></span>
          <svg viewBox="0 0 48 48"><path class="beat-fill" d="M24 41s-15-9.2-15-20.2C9 14.5 13.6 10 19 10c2.2 0 4 .9 5 2.4C25 10.9 26.8 10 29 10c5.4 0 10 4.5 10 10.8C39 31.8 24 41 24 41z"/><path class="beat-line" d="M11 25h8l3-5 4 9 3-4h8"/></svg>
        </div>
        <p class="think-line" id="thinkLine">Reading his record</p>
        <div id="thinkFlag" class="flag" hidden></div>
      </div>

      <!-- ideas sheet -->
      <div class="ideas" id="ideasSheet" hidden>
        <p class="eyebrow">Common worries</p>
        <div class="idea-list">
          <button class="idea" type="button">He gets dizzy when he stands up. Is that his heart?</button>
          <button class="idea" type="button">He's puffed walking uphill. Does that change things?</button>
          <button class="idea" type="button">What does his calcium score actually mean?</button>
          <button class="idea" type="button">Should he be on a statin or aspirin?</button>
          <button class="idea" type="button">Is it safe for him to exercise now?</button>
          <button class="idea" type="button">How soon should he see a cardiologist?</button>
        </div>
        <button class="btn ghost" id="ideasClose" type="button">Back</button>
      </div>

      <!-- answer deck -->
      <div class="deck" id="answerDeck" hidden></div>
    </section>

    <!-- CHECK-IN -->
    <section class="view" id="view-check" data-view="check" hidden>
      <div class="deck" id="checkDeck"></div>
    </section>

    <!-- RECORD -->
    <section class="view" id="view-record" data-view="record" hidden>
      <div class="rec" id="rec"></div>
    </section>
  </div>

  <nav class="nav" aria-label="Sections">
    <button class="nav-btn" data-go="ask" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3zM6 11a6 6 0 0 0 12 0M12 17v3"/></svg><span>Ask</span></button>
    <button class="nav-btn" data-go="check">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12c0 4.4-3.6 8-8 8s-8-3.6-8-8 3.6-8 8-8M8.5 12l2.5 2.5L20 5.5"/></svg><span>Check-in</span></button>
    <button class="nav-btn" data-go="record">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg><span>His record</span></button>
  </nav>
</main>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="/app.js"></script>
</body>
</html>
